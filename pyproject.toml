[project]
name = "fintech-scout"
version = "0.2.0"
description = "Research agent that builds a sourced, checked market map of fintech startups"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "openpyxl>=3.1", "mcp>=2.3"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]  # the formatter handles line length; long strings are fine
